name: CD — Build e Deploy

# Só builda/publica/faz deploy da imagem Docker quando o push é em
# `main` E o agente de validação de código aprovou a versão (nota > 9),
# conforme exigido pelos requisitos do projeto.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validação de código (reaproveita ci.yml)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push da imagem Docker
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no host Docker (Proxmox/gargantua via Pangolin)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # O runner do GitHub Actions não está na VPN Pangolin do
      # Instituto Oxigênio. A estratégia aqui é conectar via SSH ao
      # host de deploy (que É acessível — por IP público/porta
      # liberada, ou porque o runner está registrado dentro da VPN,
      # ex.: um self-hosted runner em `gargantua`) e disparar
      # `docker compose pull && up -d` lá.
      #
      # Segredos necessários no repositório GitHub (Settings > Secrets
      # and variables > Actions), a preencher pela equipe:
      #   DEPLOY_HOST      - hostname/IP do host Docker de destino
      #   DEPLOY_USER      - usuário SSH com permissão de docker
      #   DEPLOY_SSH_KEY   - chave privada SSH (par dedicado ao deploy)
      #   DEPLOY_PORT      - porta SSH (opcional, padrão 22)
      #   DEPLOY_PATH      - diretório no host onde está o docker-compose.yml
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Verificar saúde do serviço após deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            for i in $(seq 1 10); do
              if curl -fsS "http://localhost:${HOST_PORT:-8000}/api/health"; then
                echo "Serviço saudável."
                exit 0
              fi
              echo "Aguardando serviço ficar saudável... ($i/10)"
              sleep 5
            done
            echo "Serviço não respondeu com saúde OK após o deploy." >&2
            exit 1
