name: CD — Build e Deploy

# Só builda/publica/faz deploy da imagem Docker quando o push é em
# `main` E o agente de validação de código aprovou a versão (nota > 9),
# conforme exigido pelos requisitos do projeto.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validação de código (reaproveita ci.yml)
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & push da imagem Docker
    needs: validate
    if: needs.validate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no host Docker (dockeroxi, via runner self-hosted)
    needs: build-and-push
    runs-on: [self-hosted, dockeroxi]
    environment: production
    env:
      DEPLOY_PATH: /opt/lab-access-manager
    steps:
      # O host de deploy (dockeroxi) só é alcançável dentro da VPN
      # Pangolin do Instituto Oxigênio, então um runner hospedado pelo
      # GitHub não conseguiria SSHar até ele. Em vez disso, um runner
      # self-hosted roda como serviço systemd no próprio dockeroxi
      # (usuário dedicado `ghrunner`, no grupo `docker`) e este job
      # executa localmente, sem precisar de SSH nem de segredos de
      # conexão. O `docker-compose.yml` de produção e o `.env` com as
      # variáveis reais (Pangolin, Next Term etc.) já vivem em
      # DEPLOY_PATH no host. O .env com os segredos reais também já
      # vive lá e não é tocado por este job — só o docker-compose.yml
      # é sincronizado a partir do repositório a cada deploy (evita o
      # arquivo em produção ficar desatualizado em relação ao
      # docker-compose.prod.yml versionado — já causou um incidente
      # real, ver docs/INFRASTRUCTURE.md).
      - name: Checkout do código (para sincronizar o docker-compose.yml)
        uses: actions/checkout@v4

      - name: Sincronizar docker-compose.yml de produção
        run: cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.yml"

      - name: Login no GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy (docker compose pull + up)
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          export IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"
          docker compose --env-file .env pull
          docker compose --env-file .env up -d --remove-orphans
          docker image prune -f

      - name: Verificar saúde do serviço após deploy
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          set -a; source .env; set +a
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:${HOST_PORT:-8000}/api/health"; then
              echo "Serviço saudável."
              exit 0
            fi
            echo "Aguardando serviço ficar saudável... ($i/10)"
            sleep 5
          done
          echo "Serviço não respondeu com saúde OK após o deploy." >&2
          exit 1
