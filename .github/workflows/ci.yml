name: CI — Validação de código

# Também exposto como "reusable workflow" (workflow_call) para que
# cd.yml possa reexecutar exatamente a mesma validação antes de fazer
# deploy, sem duplicar lógica.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      approved:
        description: "Se a nota do agente de validação foi > 9"
        value: ${{ jobs.validate.outputs.approved }}

jobs:
  validate:
    name: Lint + Testes + Cobertura + Agente de validação
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências (runtime + dev)
        run: pip install -r backend/requirements-dev.txt

      - name: "Rodar o agente de validação de código (gate: nota > 9)"
        id: gate
        run: |
          set +e
          python validation_agent/validate.py --min-score 9.0
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi
          exit $code

      - name: Publicar relatório de validação como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation_report.json
            backend/validation_report_junit.xml
            backend/validation_report_coverage.json
          retention-days: 30

      - name: Resumo no painel do GitHub Actions
        if: always()
        run: |
          echo "### Agente de validação de código" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat validation_report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
