services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${IMAGE_NAME:-lab-access-manager}:${IMAGE_TAG:-latest}
    container_name: lab-access-manager
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/lab_access.db
      UPLOAD_DIR: /app/data/uploads
      FRONTEND_DIR: /app/frontend
    volumes:
      # Persiste o banco SQLite e os documentos anexados fora do container.
      - lab_access_data:/app/data
      # Chave SSH privada usada para provisionar tars/case (somente leitura).
      - ${SSH_PROVISIONING_KEY_PATH:-./secrets/id_ed25519_provisioning}:/app/secrets/id_ed25519_provisioning:ro
      # known_hosts com as chaves de tars/case, para evitar MITM no SSH.
      - ${SSH_KNOWN_HOSTS_PATH:-./secrets/known_hosts}:/home/appuser/.ssh/known_hosts:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lab_access_data:
    driver: local
